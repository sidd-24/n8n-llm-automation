services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GROQ_API_KEY=${GROQ_API_KEY}
      - DESTINATION_URL=${DESTINATION_URL}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data: